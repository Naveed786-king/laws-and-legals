name: Build Laws And Legals APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Full build pipeline (fully logged)
        id: pipeline
        run: |
          set -x
          {
            flutter create --platforms=android --org com.lawandlegal --project-name laws_and_legals .

            python3 scripts/patch_android.py

            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings || true
            flutter build apk --debug
            flutter build appbundle --release
          } > build-log.txt 2>&1
        continue-on-error: true

      - name: Print debug keystore SHA-1 (for Google Sign-In setup)
        if: always()
        run: |
          {
            echo "Searching for debug.keystore..."
            find / -name "debug.keystore" 2>/dev/null | while read -r ks; do
              echo "--- Found: $ks ---"
              keytool -list -v -keystore "$ks" -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -E "SHA1|SHA-1|Alias name" || echo "keytool failed on $ks"
            done
          } > debug-keystore-info.txt 2>&1
          cat debug-keystore-info.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug-keystore-info.txt
          git commit -m "CI: update debug keystore SHA-1 info [skip ci]" || true
          git push origin HEAD:main || true

      - name: Prepare log tail
        if: always()
        run: |
          if [ -f build-log.txt ]; then
            tail -c 80000 build-log.txt > build-log-tail.txt
          else
            echo "build-log.txt was never created - pipeline failed before any output was captured." > build-log-tail.txt
          fi

      - name: Commit log on failure
        if: steps.pipeline.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log-tail.txt
          git commit -m "CI: add build log (failure) [skip ci]" || true
          git push origin HEAD:main || true

      - name: Fail job if pipeline failed
        if: steps.pipeline.outcome == 'failure'
        run: exit 1

      - name: Rename outputs for friendly filenames
        run: |
          mkdir -p release-out
          cp build/app/outputs/flutter-apk/app-debug.apk release-out/LawsAndLegals-debug.apk
          cp build/app/outputs/bundle/release/app-release.aab release-out/LawsAndLegals-release.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laws-and-legals-build
          path: release-out/*

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Laws And Legals build ${{ github.run_number }}
          body: "Automatic Demo Mode build from commit ${{ github.sha }}. Download the APK to install directly (no zip extraction needed). AAB is for future Play Store upload."
          files: release-out/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
