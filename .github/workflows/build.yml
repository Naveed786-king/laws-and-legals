name: Build Laws And Legals APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Android platform folder
        run: |
          flutter create --platforms=android --org com.lawandlegal --project-name laws_and_legals .
          # Give the app a human-friendly label instead of the raw project name.
          sed -i 's/android:label="laws_and_legals"/android:label="Laws And Legals"/' android/app/src/main/AndroidManifest.xml
          # This Firebase project's Android app is registered under package
          # name "com.lawandlegal" exactly (no extra suffix), matching the
          # committed google-services.json. `flutter create --org` appends the
          # project name as a suffix, so we override applicationId/namespace
          # directly to match exactly.
          sed -i 's/applicationId = "com.lawandlegal.laws_and_legals"/applicationId = "com.lawandlegal"/' android/app/build.gradle.kts
          sed -i 's/namespace = "com.lawandlegal.laws_and_legals"/namespace = "com.lawandlegal"/' android/app/build.gradle.kts

      - name: Wire in Firebase (google-services plugin + config)
        run: |
          cp firebase-config/google-services.json android/app/google-services.json
          # Root-level plugin declaration
          sed -i '/id("org.jetbrains.kotlin.android") version .* apply false/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          # App-level: apply the plugin
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          # App-level: add Firebase BoM + Analytics + Messaging (Core is enough
          # to satisfy the plugin; Messaging matches the Flutter firebase_messaging package)
          sed -i '/dependencies {/a\    implementation(platform("com.google.firebase:firebase-bom:33.5.1"))\n    implementation("com.google.firebase:firebase-analytics")\n    implementation("com.google.firebase:firebase-messaging")' android/app/build.gradle.kts
          echo "--- settings.gradle.kts ---"; cat android/settings.gradle.kts
          echo "--- app/build.gradle.kts ---"; cat android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Debug APK
        id: build_apk
        run: flutter build apk --debug > build-log.txt 2>&1
        continue-on-error: true

      - name: Build Release AAB
        id: build_aab
        if: steps.build_apk.outcome == 'success'
        run: flutter build appbundle --release >> build-log.txt 2>&1
        continue-on-error: true

      - name: Prepare log tail
        if: always()
        run: tail -c 60000 build-log.txt > build-log-tail.txt || cp build-log.txt build-log-tail.txt

      - name: Commit log on failure
        if: steps.build_apk.outcome == 'failure' || steps.build_aab.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-log-tail.txt
          git commit -m "CI: add build log (failure) [skip ci]" || true
          git push origin HEAD:main || true

      - name: Fail job if any build failed
        if: steps.build_apk.outcome == 'failure' || steps.build_aab.outcome == 'failure'
        run: exit 1

      - name: Rename outputs for friendly filenames
        run: |
          mkdir -p release-out
          cp build/app/outputs/flutter-apk/app-debug.apk release-out/LawsAndLegals-debug.apk
          cp build/app/outputs/bundle/release/app-release.aab release-out/LawsAndLegals-release.aab

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laws-and-legals-build
          path: release-out/*

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Laws And Legals build ${{ github.run_number }}
          body: "Automatic Demo Mode build from commit ${{ github.sha }}. Download the APK to install directly (no zip extraction needed). AAB is for future Play Store upload."
          files: release-out/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
