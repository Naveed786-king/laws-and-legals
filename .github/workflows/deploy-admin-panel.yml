name: Deploy Admin Panel to Firebase Hosting

on:
  push:
    branches: [ "main" ]
    paths:
      - "admin-panel/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "storage.rules"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Hosting + Firestore rules + Storage rules
        id: deploy
        if: env.HAS_SECRET == 'true'
        env:
          HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          {
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
            npx firebase-tools@13 deploy \
              --only hosting,firestore:rules,storage:rules \
              --project basic-buttress-470212-g2 \
              --non-interactive
            rm -f /tmp/firebase-service-account.json
          } > deploy-log.txt 2>&1
        continue-on-error: true

      - name: Show and commit log on failure
        if: steps.deploy.outcome == 'failure'
        run: |
          tail -c 60000 deploy-log.txt > deploy-log-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f deploy-log-tail.txt
          git commit -m "CI: add deploy log (failure) [skip ci]" || true
          git push origin HEAD:main || true
          exit 1

      - name: Reminder if secret missing
        if: env.HAS_SECRET != 'true'
        env:
          HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set yet - nothing was deployed. Add the secret to enable auto-deploy."
