name: laws_and_legals
description: Laws And Legals - Hindi Legal News App (Demo Mode)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (used later when WordPress is connected; demo mode doesn't call it)
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.5

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Firebase (configured but inert until Settings > Configure Everything is completed)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0
  shared_preferences_platform_interface: ^2.4.1

  # Utilities
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.5.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
