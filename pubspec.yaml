name: laws_and_legals
description: Laws And Legals - Hindi Legal News App (Demo Mode)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (used later when WordPress is connected; demo mode doesn't call it)
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.5

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Firebase (configured but inert until Settings > Configure Everything is completed)
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0
  shared_preferences_platform_interface: ^2.4.1

  # Utilities
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.5.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  # No local image assets yet - all images are network-loaded (demo content
  # uses picsum.photos placeholders; live content will use WordPress/Firebase
  # Storage URLs). Add an `assets:` section here once real bundled assets
  # (app icon source art, etc.) exist.
