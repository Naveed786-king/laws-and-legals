<div id="login-screen">

    <h1>Laws And Legals</h1>

</div>

<div id="app-shell" class="hidden">

    <h2>Laws And Legals</h2>
    <nav id="nav-links">

      <a href="#/youtube" data-route="youtube">YouTube</a>
      <a href="#/notifications" data-route="notifications">Notifications</a>
      <a href="#/theme" data-route="theme">Theme &amp; Colors</a>
      <a href="#/splash" data-route="splash">Splash Screen</a>
    </nav>
    <a href="#" id="logout-link" class="logout-link">Sign Out</a>
  </div>
  <div id="main-content">
    <div id="page-outlet">Loading...</div>
  </div>
</div>

<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
